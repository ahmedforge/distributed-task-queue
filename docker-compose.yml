services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: dtq_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: task_queue_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_queue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Task Broker
  redis:
    image: redis:7-alpine
    container_name: dtq_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Web Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtq_api
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: task_queue_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DIR: /app/data/jobs
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-60}
    volumes:
      - job_files:/app/data/jobs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. SAQ Background Worker Process
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtq_worker
    command: saq app.worker.settings --verbose
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: task_queue_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DIR: /app/data/jobs
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-2}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-60}
    volumes:
      - job_files:/app/data/jobs
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. Built React dashboard with same-origin API/WebSocket proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  job_files:
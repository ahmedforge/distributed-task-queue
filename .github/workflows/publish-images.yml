name: Publish versioned images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Serialize release publication so an older run cannot overwrite a newer latest.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.tags.outputs.prefix }}
      version: ${{ steps.tags.outputs.version }}
      sha: ${{ steps.tags.outputs.sha }}
      latest: ${{ steps.tags.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version and choose newest stable tag
        id: tags
        run: python3 scripts/image_tags.py

  publish:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            scan_exit_code: 0
            context: .
            file: Dockerfile
          - service: worker
            scan_exit_code: 0
            context: .
            file: Dockerfile
          - service: frontend
            scan_exit_code: 1
            context: frontend
            file: frontend/Dockerfile
          - service: minio
            scan_exit_code: 0
            context: .
            file: docker/minio.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build local scan image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          tags: dtq-scan:${{ matrix.service }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Scan fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          image-ref: dtq-scan:${{ matrix.service }}
          timeout: 20m
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-${{ matrix.service }}.txt
          exit-code: ${{ matrix.scan_exit_code }}
      - name: Show scan report
        if: always()
        run: cat "trivy-${SERVICE}.txt"
        env:
          SERVICE: ${{ matrix.service }}
      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          if-no-files-found: warn
      - name: Log in to GHCR with the job token
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.metadata.outputs.prefix }}-${{ matrix.service }}
          VERSION: ${{ needs.metadata.outputs.version }}
          SHA_TAG: ${{ needs.metadata.outputs.sha }}
          IS_LATEST: ${{ needs.metadata.outputs.latest }}
        run: |
          {
            echo 'tags<<EOF'
            echo "$IMAGE:$VERSION"
            echo "$IMAGE:$SHA_TAG"
            if [ "$IS_LATEST" = true ]; then echo "$IMAGE:latest"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Publish scanned build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

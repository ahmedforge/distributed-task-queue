name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POSTGRES_SERVER: 127.0.0.1
      POSTGRES_PORT: '5433'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: queue_password
      POSTGRES_DB: task_queue
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      DTQ_TEST_S3_ENDPOINT: http://127.0.0.1:19000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: queue_password
          POSTGRES_DB: task_queue
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d task_queue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.5.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Cache Python environment
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-poetry251-${{ hashFiles('poetry.lock') }}
      - name: Install PDF renderer
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check lockfile and install dependencies
        run: |
          poetry check --lock
          poetry install --no-interaction
      - name: Check Python formatting
        run: poetry run black --check app worker tests alembic scripts
      - name: Check migration lifecycle on a separate fresh database
        env:
          POSTGRES_DB: task_queue_migrations
        run: poetry run python scripts/check_migrations.py
      - name: Start MinIO for shared storage integration tests
        run: |
          docker build -f docker/minio.Dockerfile -t dtq-minio:test .
          docker run -d --name dtq-test-minio -p 127.0.0.1:19000:9000 -e MINIO_ROOT_USER=dtq-test -e MINIO_ROOT_PASSWORD=dtq-test-password dtq-minio:test server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs dtq-test-minio
          exit 1
      - name: Run backend tests
        run: poetry run pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck and build frontend
        run: npm run build

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: '5432'
  POSTGRES_USER: postgres
  POSTGRES_DB: dtq
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: dtq-jobs
  S3_REGION: us-east-1
  WORKER_CONCURRENCY: '1'
  WORKER_SHUTDOWN_GRACE_SECONDS: '1800'
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: dtq-local-password
  S3_ACCESS_KEY: dtq-local
  S3_SECRET_KEY: dtq-local-password
  MINIO_ROOT_USER: dtq-local
  MINIO_ROOT_PASSWORD: dtq-local-password

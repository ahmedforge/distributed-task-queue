apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      containers:
      - name: frontend
        image: dtq-frontend:k8s
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 64Mi
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: proxy
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: frontend.conf
          readOnly: true
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
      volumes:
      - name: proxy
        configMap:
          name: frontend-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
  - port: 8080
    targetPort: 8080

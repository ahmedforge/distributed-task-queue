# Opt-in shared storage. Use with docker-compose.yml on a fresh job database.
x-object-storage: &object-storage
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: dtq-jobs
  S3_REGION: us-east-1
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dtq-local}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dtq-local-password}

services:
  minio:
    image: dtq-minio:local
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dtq-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dtq-local-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    build: .
    environment: *object-storage
    command: ["python", "-c", "from app.core.storage import initialize_bucket; initialize_bucket()"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  api:
    environment: *object-storage
    volumes: !reset []
    depends_on:
      storage-init:
        condition: service_completed_successfully

  worker:
    environment: *object-storage
    volumes: !reset []
    depends_on:
      storage-init:
        condition: service_completed_successfully

volumes:
  minio_data:
